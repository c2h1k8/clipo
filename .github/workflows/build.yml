name: build

# - PR: Mac と Windows でコンパイルが通るかだけ確認（速い。配布用ビルドはしない）
# - main への push でバージョン（tauri.conf.json）が新しくなっていたら:
#   CI がタグ v<version> を打って下書き Release を作り、両 OS の配布用ビルドを添付してから公開する
# - main への push でもバージョンが同じならコンパイル確認だけ（キャッシュを main に残すため）
# ドキュメントだけの変更ではビルドしない（バージョンを上げる変更は package.json 等を含むので必ず動く）
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: write # タグと Release の作成に必要

env:
  # Rust のバージョンを固定する。stable のままだと新しい Rust が出るたびに
  # rust-cache のキーが変わり、リリース用キャッシュが一度も当たらなくなる（リリースは間隔が空くため）。
  # 上げるときはここを書き換える（その次のビルドだけキャッシュなしになる）
  RUST_TOOLCHAIN: "1.100.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version / decide whether to release
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if gh api "repos/${{ github.repository }}/git/ref/tags/v$version" >/dev/null 2>&1; then
              echo "v$version は既にあるのでリリースしません"
            else
              release=true
              echo "v$version を新しくリリースします"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create draft release (and tag)
        id: draft
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## ダウンロード
          - **Mac**: `Clipo_*_universal.dmg`（Apple Silicon / Intel 両対応）
          - **Windows**: `Clipo_*_x64-setup.exe`

          ### 初回起動の注意
          このアプリは署名されていないため、初回は警告が出ます。
          - **Mac**: dmg からアプリケーションへ移したあと、Finder で Clipo を右クリック →「開く」
          - **Windows**: SmartScreen の「詳細情報」→「実行」
          EOF
          # 作成直後は一覧 API に出てこないことがあるので、タグ名で直接引いて再試行する
          find_id() {
            for n in 1 2 3 4 5 6; do
              id=$(gh release view "v$VERSION" --json databaseId -q .databaseId 2>/dev/null || true)
              [ -n "$id" ] && { echo "$id"; return; }
              sleep 5
            done
          }
          id=$(find_id)
          if [ -n "$id" ]; then
            # 前回失敗して残った下書きを使い回す（下書きは公開するまでタグが作られない）
            echo "既存の下書き Release ($id) を使います"
            gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f target_commitish="${{ github.sha }}" >/dev/null
          else
            gh release create "v$VERSION" --draft --title "Clipo v$VERSION" \
              --target "${{ github.sha }}" --notes-file notes.md --generate-notes
            id=$(find_id)
          fi
          if [ -z "$id" ]; then
            echo "::error::下書き Release の ID を取得できませんでした"
            exit 1
          fi
          echo "下書き Release: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # コンパイルが通るかだけ確認。
  # main でも動かして、そのキャッシュを main に保存する（PR で保存したキャッシュは他のブランチから使えないため）
  # リリースのときは publish の後に回す（配布用ビルドと Mac の実行環境を取り合わないように。
  # 配布用ビルドが通ればコンパイルは確認できているので、ここはキャッシュを残すためだけ）。
  # リリースしないときは publish が skipped になるので、prepare の直後に動く
  check:
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: check
          # PR では読むだけ（PR ごとに数百 MB のキャッシュが増えるのを防ぐ）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Type check
        run: npm run check

      # tauri のビルドスクリプトはフロントの出力先（build/）があることを前提にする
      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

  # リリース用（Windows）: 配布用ビルドを作って下書き Release に添付
  build-windows:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Check release id
        shell: bash
        run: |
          if [ -z "${{ needs.prepare.outputs.release_id }}" ]; then
            echo "::error::release_id が空です（成果物を添付できないので止めます）"
            exit 1
          fi

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          releaseId: ${{ needs.prepare.outputs.release_id }}

  # リリース用（Mac）その1: Apple Silicon 用と Intel 用の実行ファイルを別々のジョブで同時にビルドする
  # （tauri build --target universal-apple-darwin だと 2 つを順番にビルドするので倍かかる）
  build-mac:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 2 つのジョブは同じ OS なので、ターゲットで分けないとキャッシュが取り合いになる
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # フロントのビルド（beforeBuildCommand）も含む。バンドル（.app / dmg 作成）は bundle-mac でまとめてやる
      - name: Build binary
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle --ci

      - uses: actions/upload-artifact@v4
        with:
          name: clipo-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/clipo
          if-no-files-found: error
          retention-days: 1

  # リリース用（Mac）その2: 2 つの実行ファイルを lipo で 1 つ（両対応）にまとめ、dmg を作って添付
  bundle-mac:
    needs: [prepare, build-mac]
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # tauri bundle はビルドしないが、cargo metadata で target フォルダの場所を調べるので Rust は要る
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: clipo-*
          path: bins

      - name: Combine into a universal binary
        run: |
          out=src-tauri/target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create bins/clipo-aarch64-apple-darwin/clipo bins/clipo-x86_64-apple-darwin/clipo -output "$out/clipo"
          chmod +x "$out/clipo"
          lipo -info "$out/clipo"

      - name: Bundle dmg
        run: npm run tauri -- bundle --target universal-apple-darwin --bundles dmg --ci

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          REPO: ${{ github.repository }}
        # 下書きは公開するまでタグがないので、gh release upload v<version> だと "release not found" になる。
        # prepare が作った Release の ID で直接アップロードする
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::release_id が空です（成果物を添付できないので止めます）"
            exit 1
          fi
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          name=$(basename "$dmg")
          echo "$dmg"
          # 再実行のとき用: 同じ名前の添付が残っていたら消す
          old=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" -q ".[] | select(.name == \"$name\") | .id")
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/$REPO/releases/assets/$old"
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$dmg" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name" > /dev/null
          echo "$name を添付しました"

  publish:
    needs: [prepare, build-windows, bundle-mac]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.prepare.outputs.version }}"
          assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -q '\.dmg$' || { echo "::error::Mac の dmg が添付されていません"; exit 1; }
          echo "$assets" | grep -q 'setup\.exe$' || { echo "::error::Windows の exe が添付されていません"; exit 1; }
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false --latest
