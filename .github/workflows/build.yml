name: build

# - PR: Mac と Windows でコンパイルが通るかだけ確認（速い。配布用ビルドはしない）
# - main への push でバージョン（tauri.conf.json）が新しくなっていたら:
#   CI がタグ v<version> を打って下書き Release を作り、両 OS の配布用ビルドを添付してから公開する
# - main への push でもバージョンが同じならコンパイル確認だけ（キャッシュを main に残すため）
# ドキュメントだけの変更ではビルドしない（バージョンを上げる変更は package.json 等を含むので必ず動く）
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: write # タグと Release の作成に必要

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version / decide whether to release
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if gh api "repos/${{ github.repository }}/git/ref/tags/v$version" >/dev/null 2>&1; then
              echo "v$version は既にあるのでリリースしません"
            else
              release=true
              echo "v$version を新しくリリースします"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create draft release (and tag)
        id: draft
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## ダウンロード
          - **Mac**: `Clipo_*_universal.dmg`（Apple Silicon / Intel 両対応）
          - **Windows**: `Clipo_*_x64-setup.exe`

          ### 初回起動の注意
          このアプリは署名されていないため、初回は警告が出ます。
          - **Mac**: dmg からアプリケーションへ移したあと、Finder で Clipo を右クリック →「開く」
          - **Windows**: SmartScreen の「詳細情報」→「実行」
          EOF
          # 作成直後は一覧 API に出てこないことがあるので、タグ名で直接引いて再試行する
          find_id() {
            for n in 1 2 3 4 5 6; do
              id=$(gh release view "v$VERSION" --json databaseId -q .databaseId 2>/dev/null || true)
              [ -n "$id" ] && { echo "$id"; return; }
              sleep 5
            done
          }
          id=$(find_id)
          if [ -n "$id" ]; then
            # 前回失敗して残った下書きを使い回す（下書きは公開するまでタグが作られない）
            echo "既存の下書き Release ($id) を使います"
            gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f target_commitish="${{ github.sha }}" >/dev/null
          else
            gh release create "v$VERSION" --draft --title "Clipo v$VERSION" \
              --target "${{ github.sha }}" --notes-file notes.md --generate-notes
            id=$(find_id)
          fi
          if [ -z "$id" ]; then
            echo "::error::下書き Release の ID を取得できませんでした"
            exit 1
          fi
          echo "下書き Release: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # コンパイルが通るかだけ確認。
  # main でも動かして、そのキャッシュを main に保存する（PR で保存したキャッシュは他のブランチから使えないため）
  check:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: check
          # PR では読むだけ（PR ごとに数百 MB のキャッシュが増えるのを防ぐ）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Type check
        run: npm run check

      # tauri のビルドスクリプトはフロントの出力先（build/）があることを前提にする
      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

  # リリース用: 配布用ビルドを作って下書き Release に添付
  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Check release id
        shell: bash
        run: |
          if [ -z "${{ needs.prepare.outputs.release_id }}" ]; then
            echo "::error::release_id が空です（成果物を添付できないので止めます）"
            exit 1
          fi

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.prepare.outputs.version }}"
          assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -q '\.dmg$' || { echo "::error::Mac の dmg が添付されていません"; exit 1; }
          echo "$assets" | grep -q 'setup\.exe$' || { echo "::error::Windows の exe が添付されていません"; exit 1; }
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false --latest
