name: build

# - PR / main への push: Mac と Windows でビルドできるか確認
# - main への push でバージョン（tauri.conf.json）が新しくなっていたら:
#   CI がタグ v<version> を打って下書き Release を作り、両 OS の成果物を添付してから公開する
# ドキュメントだけの変更ではビルドしない（バージョンを上げる変更は package.json 等を含むので必ず動く）
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: write # タグと Release の作成に必要

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version / decide whether to release
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if gh api "repos/${{ github.repository }}/git/ref/tags/v$version" >/dev/null 2>&1; then
              echo "v$version は既にあるのでリリースしません"
            else
              release=true
              echo "v$version を新しくリリースします"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create draft release (and tag)
        id: draft
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## ダウンロード
          - **Mac**: `Clipo_*_universal.dmg`（Apple Silicon / Intel 両対応）
          - **Windows**: `Clipo_*_x64-setup.exe`（または `.msi`）

          ### 初回起動の注意
          このアプリは署名されていないため、初回は警告が出ます。
          - **Mac**: dmg からアプリケーションへ移したあと、Finder で Clipo を右クリック →「開く」
          - **Windows**: SmartScreen の「詳細情報」→「実行」
          EOF
          find_id() {
            gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"v$VERSION\") | .id" | head -1
          }
          id=$(find_id)
          if [ -n "$id" ]; then
            # 前回失敗して残った下書きを使い回す（下書きは公開するまでタグが作られない）
            echo "既存の下書き Release ($id) を使います"
            gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f target_commitish="${{ github.sha }}" >/dev/null
          else
            gh release create "v$VERSION" --draft --title "Clipo v$VERSION" \
              --target "${{ github.sha }}" --notes-file notes.md --generate-notes
            id=$(find_id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build (and upload to the draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release == 'true' && needs.prepare.outputs.release_id || '' }}

      - name: Upload artifacts (non-release builds)
        if: needs.prepare.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clipo-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
