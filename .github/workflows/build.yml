name: build

# - PR: Mac と Windows でコンパイルが通るかだけ確認（速い。配布用ビルドはしない）
# - main への push でバージョン（tauri.conf.json）が新しくなっていたら:
#   CI がタグ v<version> を打って下書き Release を作り、両 OS の配布用ビルドを添付してから公開する
# - main への push でもバージョンが同じならコンパイル確認だけ（キャッシュを main に残すため）
# ドキュメントだけの変更ではビルドしない（バージョンを上げる変更は package.json 等を含むので必ず動く）
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: write # タグと Release の作成に必要

env:
  # Rust のバージョンを固定する。stable のままだと新しい Rust が出るたびに
  # rust-cache のキーが変わり、リリース用キャッシュが一度も当たらなくなる（リリースは間隔が空くため）。
  # 上げるときはここを書き換える（その次のビルドだけキャッシュなしになる）
  RUST_TOOLCHAIN: "1.100.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version / decide whether to release
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if gh api "repos/${{ github.repository }}/git/ref/tags/v$version" >/dev/null 2>&1; then
              echo "v$version は既にあるのでリリースしません"
            else
              release=true
              echo "v$version を新しくリリースします"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create draft release (and tag)
        id: draft
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## ダウンロード
          - **Mac**: `Clipo_*_universal.dmg`（Apple Silicon / Intel 両対応）
          - **Windows**: `Clipo_*_x64-setup.exe`

          ### 初回起動の注意
          このアプリは Apple / Microsoft の有料の署名をしていないため、最初の 1 回だけ警告が出ます。
          - **Mac**: dmg からアプリケーションへ移して開く →「開けません」と出たら
            「システム設定 → プライバシーとセキュリティ」の下の方にある「このまま開く」
          - **Windows**: SmartScreen の「詳細情報」→「実行」

          ### 2 回目からはアプリ内でアップデート
          v0.4.0 以降はメニューバー（タスクトレイ）の Clipo →「アップデートを確認」、または設定画面から更新できます。
          この方法なら警告は出ず、Mac のアクセシビリティ・画面収録の許可もそのまま残ります。
          EOF
          # 作成直後は一覧 API に出てこないことがあるので、タグ名で直接引いて再試行する
          find_id() {
            for n in 1 2 3 4 5 6; do
              id=$(gh release view "v$VERSION" --json databaseId -q .databaseId 2>/dev/null || true)
              [ -n "$id" ] && { echo "$id"; return; }
              sleep 5
            done
          }
          id=$(find_id)
          if [ -n "$id" ]; then
            # 前回失敗して残った下書きを使い回す（下書きは公開するまでタグが作られない）
            echo "既存の下書き Release ($id) を使います"
            gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f target_commitish="${{ github.sha }}" >/dev/null
          else
            gh release create "v$VERSION" --draft --title "Clipo v$VERSION" \
              --target "${{ github.sha }}" --notes-file notes.md --generate-notes
            id=$(find_id)
          fi
          if [ -z "$id" ]; then
            echo "::error::下書き Release の ID を取得できませんでした"
            exit 1
          fi
          echo "下書き Release: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # コンパイルが通るかだけ確認。
  # main でも動かして、そのキャッシュを main に保存する（PR で保存したキャッシュは他のブランチから使えないため）
  check:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: check
          # PR では読むだけ（PR ごとに数百 MB のキャッシュが増えるのを防ぐ）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Type check
        run: npm run check

      # tauri のビルドスクリプトはフロントの出力先（build/）があることを前提にする
      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

  # リリース用（Windows）: 配布用ビルドを作って下書き Release に添付
  build-windows:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Check release id
        shell: bash
        run: |
          if [ -z "${{ needs.prepare.outputs.release_id }}" ]; then
            echo "::error::release_id が空です（成果物を添付できないので止めます）"
            exit 1
          fi

      - name: Build installer
        env:
          # アプリ内アップデート用のファイル（setup.exe.sig）に署名する鍵
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis --config src-tauri/release.conf.json --ci

      # latest.json は publish で Mac の分と合わせて作る
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          REPO: ${{ github.repository }}
        run: |
          upload() { # <ファイル> <添付名>
            old=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" -q ".[] | select(.name == \"$2\") | .id")
            # 再実行のとき用: 同じ名前の添付が残っていたら消す
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/$REPO/releases/assets/$old"
            fi
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$1" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$2" > /dev/null
            echo "$2 を添付しました"
          }
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          upload "$exe" "$(basename "$exe")"
          upload "$exe.sig" "$(basename "$exe").sig"

  # リリース用（Mac）その1: Apple Silicon 用と Intel 用の実行ファイルを別々のジョブで同時にビルドする
  # （tauri build --target universal-apple-darwin だと 2 つを順番にビルドするので倍かかる）
  build-mac:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 2 つのジョブは同じ OS なので、ターゲットで分けないとキャッシュが取り合いになる
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # フロントのビルド（beforeBuildCommand）も含む。バンドル（.app / dmg 作成）は bundle-mac でまとめてやる
      - name: Build binary
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle --ci

      - uses: actions/upload-artifact@v4
        with:
          name: clipo-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/clipo
          if-no-files-found: error
          retention-days: 1

  # リリース用（Mac）その2: 2 つの実行ファイルを lipo で 1 つ（両対応）にまとめ、dmg を作って添付
  bundle-mac:
    needs: [prepare, build-mac]
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # tauri bundle はビルドしないが、cargo metadata で target フォルダの場所を調べるので Rust は要る
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: clipo-*
          path: bins

      - name: Combine into a universal binary
        run: |
          out=src-tauri/target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create bins/clipo-aarch64-apple-darwin/clipo bins/clipo-x86_64-apple-darwin/clipo -output "$out/clipo"
          chmod +x "$out/clipo"
          lipo -info "$out/clipo"

      # 自己署名の証明書で署名する。毎回同じ証明書で署名すると、macOS がバージョンが変わっても
      # 同じアプリと見なすので、アクセシビリティ・画面収録の許可が外れない（ad-hoc 署名だと毎回外れる）。
      # 信頼されていない証明書は find-identity -v に出ないため、tauri の APPLE_CERTIFICATE は使えない。
      # 自分でキーチェーンに入れて検索リストに足し、APPLE_SIGNING_IDENTITY の名前で codesign させる
      - name: Import signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "::error::APPLE_CERT_P12 が設定されていません"
            exit 1
          fi
          kc="$RUNNER_TEMP/clipo.keychain-db"
          kp=$(openssl rand -hex 16)
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$kc"

      - name: Bundle app and dmg
        env:
          APPLE_SIGNING_IDENTITY: Clipo Self-Signed
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- bundle --target universal-apple-darwin --bundles app,dmg --config src-tauri/release.conf.json --ci

      # ad-hoc 署名に戻っていたら許可が毎回外れるので、ここで止める
      - name: Verify signature
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Clipo.app
          codesign --verify --deep --strict "$app"
          codesign -dr - "$app" 2>&1 | tee /dev/stderr | grep -q 'certificate leaf' \
            || { echo "::error::自己署名の証明書で署名されていません"; exit 1; }

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # 下書きは公開するまでタグがないので、gh release upload v<version> だと "release not found" になる。
        # prepare が作った Release の ID で直接アップロードする
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::release_id が空です（成果物を添付できないので止めます）"
            exit 1
          fi
          upload() { # <ファイル> <添付名>
            old=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" -q ".[] | select(.name == \"$2\") | .id")
            # 再実行のとき用: 同じ名前の添付が残っていたら消す
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/$REPO/releases/assets/$old"
            fi
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$1" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$2" > /dev/null
            echo "$2 を添付しました"
          }
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          dmg=$(ls $bundle/dmg/*.dmg)
          upload "$dmg" "$(basename "$dmg")"
          # アプリ内アップデート用
          tgz="Clipo_${VERSION}_universal.app.tar.gz"
          upload "$bundle/macos/Clipo.app.tar.gz" "$tgz"
          upload "$bundle/macos/Clipo.app.tar.gz.sig" "$tgz.sig"

  publish:
    needs: [prepare, build-windows, bundle-mac]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # アプリ内アップデートが見に行く latest.json（.../releases/latest/download/latest.json）を作って添付する
      - name: Attach latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          assets=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets")
          asset_id() { echo "$assets" | jq -r --arg n "$1" '.[] | select(.name == $n) | .id'; }
          sig_of() { # <添付名> → その .sig の中身
            id=$(asset_id "$1.sig")
            [ -n "$id" ] || { echo "::error::$1.sig がありません" >&2; exit 1; }
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id"
          }
          mac="Clipo_${VERSION}_universal.app.tar.gz"
          win=$(echo "$assets" | jq -r '.[] | select(.name | endswith("-setup.exe")) | .name')
          [ -n "$win" ] || { echo "::error::Windows の setup.exe がありません"; exit 1; }
          mac_sig=$(sig_of "$mac")
          win_sig=$(sig_of "$win")
          url="https://github.com/$REPO/releases/download/v$VERSION"
          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mu "$url/$mac" --arg ms "$mac_sig" --arg wu "$url/$win" --arg ws "$win_sig" '{
              version: $v, pub_date: $d, notes: "",
              platforms: {
                "darwin-aarch64": {url: $mu, signature: $ms},
                "darwin-x86_64": {url: $mu, signature: $ms},
                "windows-x86_64": {url: $wu, signature: $ws}
              }
            }' > latest.json
          cat latest.json
          old=$(asset_id latest.json)
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/$REPO/releases/assets/$old"
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=latest.json" > /dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.prepare.outputs.version }}"
          assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -q '\.dmg$' || { echo "::error::Mac の dmg が添付されていません"; exit 1; }
          echo "$assets" | grep -q 'setup\.exe$' || { echo "::error::Windows の exe が添付されていません"; exit 1; }
          echo "$assets" | grep -qx 'latest\.json' || { echo "::error::latest.json が添付されていません"; exit 1; }
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false --latest
